<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kontakt</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            line-height: 1.6;
        }

        header, footer {
            background-color: #222;
            color: #fff;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        section {
            background: #fff;
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        h1, h2 {
            margin-bottom: 15px;
        }

        ul {
            list-style: none;
        }

        ul li {
            margin-bottom: 8px;
        }

        form div {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #0077cc;
        }

        button {
            background-color: #0077cc;
            color: #fff;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fa3;
        }

        footer p {
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>Kontakt</h1>
    <p>Masz pytanie, problem albo coś się zepsuło? Zdarza się.</p>
</header>

<main>
    <section>
        <h2>Dane kontaktowe</h2>
        <ul>
            <li><strong>Email:</strong> kontakt@twojadomena.pl</li>
            <li><strong>Telefon:</strong> +48 123 456 789</li>
            <li><strong>Adres:</strong> ul. Przykładowa 1, 00-000 Miasto</li>
            <li><strong>Kraj:</strong> Polska</li>
    </section>

    <section>
        <h2>Formularz kontaktowy</h2>
        <form action="/wyslij" method="post">
            <div>
                <label for="name">Imię</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div>
                <label for="message">Wiadomość</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>

            <button type="submit">Wyślij</button>
        </form>
    </section>
</main>

<footer>
    <p>&copy; 2026 Twoja Firma</p>
    <p>Pozdrawiamy</p>

</footer>

</body>
</html>
